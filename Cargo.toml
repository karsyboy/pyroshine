[workspace]
members = [".", "moonshine-core", "moonshine-management", "moonshine-tools"]
# The optional desktop UI is a separate workspace so headless builds never
# compile its GUI dependencies; see pyroshine-ui/README.md.
exclude = ["pyroshine-ui"]
resolver = "2"

[workspace.package]
version = "0.17.4"

[package]
name = "moonshine"
version.workspace = true
edition = "2024"

[dependencies]
async-shutdown = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
moonshine-core = { path = "moonshine-core" }
moonshine-management = { path = "moonshine-management" }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "5.18.0"

[dev-dependencies]
tempfile = "3.27.0"

# Keep the upstream Rust API; patch only its native backend at the locked revision.
[patch."https://github.com/games-on-whales/inputtino"]
inputtino-sys = { path = "vendor/inputtino/bindings/rust/inputtino-sys" }

# Pixelforge v0.9.1 with Pyroshine's local changes; see vendor/pixelforge/LOCAL_CHANGES.md.
[patch."https://github.com/hgaiser/pixelforge"]
pixelforge = { path = "vendor/pixelforge" }
