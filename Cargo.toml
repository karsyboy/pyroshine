[workspace]
# web/ is the web interface's npm project (no Rust). The desktop tray in
# src/tray links no GUI toolkit, so every member builds on a headless host.
members = [".", "moonshine-core", "moonshine-management", "moonshine-tools"]
resolver = "2"

[workspace.package]
version = "0.18.0-alpha.0"

[package]
name = "moonshine"
version.workspace = true
edition = "2024"

[dependencies]
async-shutdown = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The desktop tray (src/tray): a StatusNotifierItem over D-Bus, no GUI toolkit.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Unreleased upstream API: `Tray::provide_xdg_activation_token` (Plasma's
# ProvideXdgActivationToken). Return to a crates.io release after 0.3.6.
# async-io, like zbus: enabling zbus's tokio feature would change the
# server's D-Bus executor.
ksni = { git = "https://github.com/iovxw/ksni", rev = "547cc42b9e24ed58c20e7643644184bc2264c9b0", default-features = false, features = ["async-io"] }
# Operator restarts: descriptors are marked close-on-exec before the new start.
libc = "0.2.190"
moonshine-core = { path = "moonshine-core" }
moonshine-management = { path = "moonshine-management" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "signal", "sync", "macros", "time", "process", "io-std", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }

# Keep the upstream Rust API; patch only its native backend at the locked revision.
[patch."https://github.com/games-on-whales/inputtino"]
inputtino-sys = { path = "vendor/inputtino/bindings/rust/inputtino-sys" }

# Pixelforge v0.9.1 with Pyroshine's local changes; see vendor/pixelforge/LOCAL_CHANGES.md.
[patch."https://github.com/hgaiser/pixelforge"]
pixelforge = { path = "vendor/pixelforge" }
