[package]
name = "moonshine-tools"
version.workspace = true
edition = "2024"

[[bin]]
name = "moonshine-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "moonshine-library"
path = "src/bin/library.rs"

[[bin]]
name = "moonshine-udp-probe"
path = "src/bin/udp_probe.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
rcgen = "0.14.10"
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio-rustls = "0.26.6"
moonshine-core = { path = "../moonshine-core" }
async-shutdown = "0.2.2"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
