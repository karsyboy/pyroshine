# Every `#[ignore]`d Rust test in the workspace, with what it needs to run.
#
# `scripts/hardware_tests.py` probes the requirements, runs the tests a host
# can run, and reports the rest as skipped with the missing requirement. A
# test is passed only when its harness reports exactly one passed test, so a
# filter that matches nothing can never pass. `check-registry` fails when an
# ignored test is missing here or an entry names a test that no longer exists:
# add an entry in the same change as a new ignored test.
#
# timeout: seconds before the test is killed and failed (default: --timeout).
#   Set for tests that finish in about a second, so a hang fails fast.
#
# kind:
#   test          hardware/system contract; failures are regressions
#   informational prints measurements; runs only with --include-informational
#   helper        child process of another test; never run directly
#
# requires (probed by hardware_tests.py):
#   render-node          a readable and writable /dev/dri/renderD* node
#   vulkan-video-encode  a Vulkan device exposing VK_KHR_video_encode_queue
#   xwayland             the Xwayland binary
#   ffmpeg               the ffmpeg binary (decodes encoder output)
#   pacat                libpulse's pacat client
#   systemd-user         a reachable user systemd manager
#   kde-wayland          a signed-in, unlocked KDE Wayland session
#   desktop-takeover     explicit MOONSHINE_TEST_TAKEOVER=1 and a saved desktop input grant
#   input-devices        writable /dev/uinput and /dev/uhid
#   nvidia-gpu           an NVIDIA GPU (sets MOONSHINE_TEST_NVML to its PCI address)
#   pyrowave-library     the pinned PyroWave library (--pyrowave-library or MOONSHINE_PYROWAVE_LIBRARY)
#   unsupported-render-node  MOONSHINE_TEST_UNSUPPORTED_RENDER_NODE naming a GPU without Vulkan Video encode

