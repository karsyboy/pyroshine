# nfpm configuration for the optional desktop tray: status icon, pairing
# notifications and the application launcher, which open the web interface
# in the default browser. Used by .github/workflows/release.yaml next to
# nfpm.yaml. It links no GUI toolkit; headless installs do not need it.
#
# VERSION is injected by the release workflow (GITHUB_REF_NAME minus the 'v').

name: pyroshine-tray
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
maintainer: "Pyroshine contributors"
description: |
  Desktop tray for the Pyroshine streaming server: status icon, pairing
  notifications and shortcuts into the browser management interface.
homepage: "https://github.com/karsyboy/pyroshine"
license: "BSD-2-Clause"
# Replaces the GTK/WebKitGTK desktop app of earlier releases.
replaces:
  - pyroshine-ui
conflicts:
  - pyroshine-ui
provides:
  - pyroshine-ui

contents:
  - src: ./target/release/pyroshine-tray
    dst: /usr/bin/pyroshine-tray
  - src: ./dist/pyroshine.desktop
    dst: /usr/share/applications/pyroshine.desktop
  # Starts the tray at desktop login (only in graphical sessions); users can
  # disable it in their desktop's autostart settings.
  - src: ./dist/pyroshine-tray-autostart.desktop
    dst: /etc/xdg/autostart/pyroshine-tray.desktop
    type: config
  - src: ./dist/icons/hicolor/16x16/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/16x16/apps/pyroshine.png
  - src: ./dist/icons/hicolor/22x22/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/22x22/apps/pyroshine.png
  - src: ./dist/icons/hicolor/24x24/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/24x24/apps/pyroshine.png
  - src: ./dist/icons/hicolor/32x32/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/32x32/apps/pyroshine.png
  - src: ./dist/icons/hicolor/48x48/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/48x48/apps/pyroshine.png
  - src: ./dist/icons/hicolor/64x64/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/64x64/apps/pyroshine.png
  - src: ./dist/icons/hicolor/128x128/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/128x128/apps/pyroshine.png
  - src: ./dist/icons/hicolor/256x256/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/256x256/apps/pyroshine.png
  - src: ./dist/icons/hicolor/512x512/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/512x512/apps/pyroshine.png
  - src: ./LICENSE
    dst: /usr/share/licenses/pyroshine-tray/LICENSE
    packager: rpm
  - src: ./LICENSE
    dst: /usr/share/doc/pyroshine-tray/copyright
    packager: deb
  - src: ./LICENSE
    dst: /usr/share/licenses/pyroshine-tray/LICENSE
    packager: archlinux

scripts:
  postinstall: ./dist/nfpm/pyroshine-tray-postinstall.sh
  postremove: ./dist/nfpm/pyroshine-tray-postremove.sh

# The browser opens through the desktop portal (or xdg-open).
overrides:
  deb:
    depends:
      - pyroshine
      - libc6
    recommends:
      - xdg-desktop-portal
      - xdg-utils
  rpm:
    depends:
      - pyroshine
      - glibc
    recommends:
      - xdg-desktop-portal
      - xdg-utils
  archlinux:
    depends:
      - pyroshine
      - glibc
      - gcc-libs
      - hicolor-icon-theme
