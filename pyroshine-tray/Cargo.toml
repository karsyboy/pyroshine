[package]
name = "pyroshine-tray"
version.workspace = true
edition = "2024"
description = "Pyroshine desktop tray: status icon, pairing notifications and shortcuts into the web interface"
license = "BSD-2-Clause"
publish = false

# No GUI toolkit: the tray is a StatusNotifierItem over D-Bus (ksni), the
# notifications are org.freedesktop.Notifications calls and every page opens
# in the user's browser.
[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Unreleased upstream API: `Tray::provide_xdg_activation_token` (Plasma's
# ProvideXdgActivationToken). Return to a crates.io release after 0.3.6.
# async-io, like the server's zbus: enabling zbus's tokio feature here would
# change the daemon's executor in workspace builds.
ksni = { git = "https://github.com/iovxw/ksni", rev = "547cc42b9e24ed58c20e7643644184bc2264c9b0", default-features = false, features = ["async-io"] }
moonshine-management = { path = "../moonshine-management" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "process", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zbus = "5.19.0"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
