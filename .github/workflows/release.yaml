name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.13.0)
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Every gate runs on the exact commit being released; a release never relies
  # on CI having passed for some other commit. Results and provenance are
  # recorded in release-validation.json and shipped with the release.
  validate:
    name: Validate release commit
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.record.outputs.sha }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install dependencies
      uses: ./.github/actions/install-dependencies

    - name: Install desktop app dependencies
      run: |
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pyroshine-ui/package-lock.json

    - name: Server checks
      run: |
        set -o pipefail
        mkdir -p "$RUNNER_TEMP/validation"
        python3 -m unittest discover -s scripts -p 'test_changelog.py'
        python3 scripts/changelog.py check --tag "${{ github.event.inputs.tag || github.ref_name }}"
        cargo fmt --all -- --check
        cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
        RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --workspace --all-features
        cargo test --locked --workspace --all-features 2>&1 | tee "$RUNNER_TEMP/validation/tests.log"

    - name: Pinned PyroWave FFI check (must run, not be skipped)
      run: |
        set -o pipefail
        ./scripts/build-pyrowave.sh "$RUNNER_TEMP/pyrowave" "$RUNNER_TEMP/pyrowave-install"
        MOONSHINE_TEST_PYROWAVE=1 \
        MOONSHINE_PYROWAVE_LIBRARY="$RUNNER_TEMP/pyrowave-install/lib/libpyrowave-shared.so.1" \
          cargo test --locked -p moonshine-core session::stream::video::pyrowave::tests::ffi_loads_pinned_api \
          -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/validation/pyrowave-ffi.log"
        grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/validation/pyrowave-ffi.log"
        grep -q 'pyrowave-ffi: loaded' "$RUNNER_TEMP/validation/pyrowave-ffi.log"

    - name: Known defects and native sanitizer tests
      run: python3 scripts/known_defects.py --json "$RUNNER_TEMP/validation/known-defects.json"

    - name: Desktop app checks
      working-directory: pyroshine-ui
      run: |
        npm ci
        npm run typecheck
        npm test
        npm run build
        cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        cargo test --locked --manifest-path src-tauri/Cargo.toml

    - name: Record validation
      id: record
      run: |
        python3 scripts/record_baseline.py --out "$RUNNER_TEMP/validation/provenance" --metadata-only
        python3 - "$RUNNER_TEMP/validation" <<'PY'
        import json, pathlib, re, sys
        root = pathlib.Path(sys.argv[1])
        provenance = json.loads((root / "provenance" / "manifest.json").read_text())
        tests = re.findall(r"test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored", (root / "tests.log").read_text())
        record = {
            "checkout": provenance["checkout"],
            "toolchain": provenance["toolchain"],
            "runner": provenance["host"],
            "workspace_tests": [dict(zip(("result", "passed", "failed", "ignored"), t)) for t in tests],
            "pyrowave_ffi": "loaded and passed",
            "known_defects": json.loads((root / "known-defects.json").read_text()),
            "hardware_acceptance": "not run by CI; approved through the 'release' environment for this sha",
        }
        (root / "release-validation.json").write_text(json.dumps(record, indent=2) + "\n")
        assert all(t[0] == "ok" and t[2] == "0" for t in tests), "a test suite failed"
        PY
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      with:
        name: release-validation
        path: ${{ runner.temp }}/validation/release-validation.json

  build:
    name: Build and package
    needs: validate
    # Publishing requires approval in the 'release' environment: the reviewer
    # confirms the documented hardware acceptance (docs/reconnect-validation.md,
    # REPORT section 9) was run for exactly this commit.
    environment: release
    # Pin to ubuntu-24.04 (glibc 2.39) so the release binary runs on
    # Ubuntu 24.04+, Fedora 40+, Arch, ...
    runs-on: ubuntu-24.04

    steps:
    - name: Resolve tag
      id: tag
      env:
        REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        TAG="$REQUESTED_TAG"
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
          echo "Release tag must look like v1.2.3 or v1.2.3-rc.1, got: $TAG" >&2
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Build the validated commit only
      env:
        VALIDATED: ${{ needs.validate.outputs.sha }}
      run: test "$(git rev-parse HEAD)" = "$VALIDATED"

    - uses: actions/download-artifact@v4
      with:
        name: release-validation

    - name: Validate changelog and extract release notes
      env:
        RELEASE_TAG: ${{ steps.tag.outputs.tag }}
      run: |
        python3 scripts/changelog.py check --tag "$RELEASE_TAG"
        python3 scripts/changelog.py notes --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      uses: ./.github/actions/install-dependencies

    - name: Build pinned PyroWave
      run: |
        ./scripts/build-pyrowave.sh "$RUNNER_TEMP/pyrowave" "$RUNNER_TEMP/pyrowave-install"
        mkdir -p ./target/release
        cp -L "$RUNNER_TEMP/pyrowave-install/lib/libpyrowave-shared.so.1" \
          ./target/release/libpyrowave-shared.so.1

    - name: Build
      run: cargo build --release --workspace

    # The optional desktop app is a separate workspace and package, so the
    # server package keeps no GTK/WebKitGTK dependency.
    - name: Install desktop app dependencies
      run: |
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pyroshine-ui/package-lock.json

    - name: Build desktop app
      working-directory: pyroshine-ui
      run: |
        npm ci
        npm run build
        cargo build --release --locked --manifest-path src-tauri/Cargo.toml

    - name: Strip and fixup
      run: |
        strip ./target/release/moonshine
        # Remove libunwind — pulled in transitively via libc++ on Ubuntu but
        # never called at runtime (no C++ exceptions in the code path).
        # Can be removed if inputtino-sys is changed to link -lc++ statically
        # or dropped entirely.
        patchelf --remove-needed libunwind.so.1 ./target/release/moonshine

    - name: Bake version into install script
      run: |
        sed -i 's/VERSION="__VERSION__"/VERSION="${{ steps.tag.outputs.tag }}"/' ./dist/pyroshine-install.sh

    # Portable tarball with an FHS-ish layout (bin/, lib/, share/).
    - name: Package portable tarball
      run: |
        STAGE="$RUNNER_TEMP/pyroshine"
        mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/share/pyroshine"
        cp ./target/release/moonshine "$STAGE/bin/pyroshine"
        cp ./target/release/libpyrowave-shared.so.1 "$STAGE/lib/"
        cp ./dist/start-pyroshine.sh ./dist/60-pyroshine.rules ./dist/50-pyroshine-inhibit-sleep.rules \
           ./dist/pyroshine-modules.conf ./dist/pyroshine-sysusers.conf \
           ./dist/pyroshine@.service \
           ./dist/pyroshine-atomic-update.conf "$STAGE/share/pyroshine/"
        cp ./dist/pyroshine-install.sh "$STAGE/bin/"
        cp README.md CONTRIBUTING.md LICENSE "$STAGE/"
        cp -R docs "$STAGE/docs"
        tar --zstd -cf "./pyroshine-${{ steps.tag.outputs.tag }}-linux-amd64.tar.zst" \
          -C "$RUNNER_TEMP" pyroshine

    - name: Install nfpm
      run: |
        curl -sSfL "https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_2.47.0_Linux_x86_64.tar.gz" \
          -o /tmp/nfpm.tar.gz
        tar xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
        nfpm --version

    - name: Package native formats
      run: |
        export VERSION="${{ steps.tag.outputs.version }}"
        for fmt in deb rpm archlinux; do
          nfpm package --config nfpm.yaml --packager "$fmt" --target .
          nfpm package --config nfpm-ui.yaml --packager "$fmt" --target .
        done

    - name: Generate checksums
      run: |
        sha256sum \
          ./pyroshine-${{ steps.tag.outputs.tag }}-linux-amd64.tar.zst \
          ./pyroshine_*.deb \
          ./pyroshine-ui_*.deb \
          ./pyroshine-*.rpm \
          ./pyroshine-*.pkg.tar.zst \
          ./dist/pyroshine-install.sh \
          ./release-validation.json \
          > SHA256SUMS

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        body_path: ${{ runner.temp }}/release-notes.md
        fail_on_unmatched_files: true
        files: |
          ./pyroshine-${{ steps.tag.outputs.tag }}-linux-amd64.tar.zst
          ./pyroshine_*.deb
          ./pyroshine-ui_*.deb
          ./pyroshine-*.rpm
          ./pyroshine-*.pkg.tar.zst
          ./dist/pyroshine-install.sh
          ./release-validation.json
          ./SHA256SUMS

  # Stable releases also update the AUR packages pyroshine-bin and
  # pyroshine-ui-bin from dist/aur. Enabled by the AUR_PUBLISH repository
  # variable ('true') and the AUR_SSH_PRIVATE_KEY secret; see CONTRIBUTING.md.
  aur:
    name: Update AUR packages
    needs: build
    if: vars.AUR_PUBLISH == 'true' && !contains(github.event.inputs.tag || github.ref_name, '-')
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
    - name: Install packaging tools
      run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Publish to the AUR
      env:
        AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        GIT_AUTHOR_NAME: ${{ github.actor }}
        GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        GIT_COMMITTER_NAME: ${{ github.actor }}
        GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
      run: |
        # makepkg refuses to run as root.
        useradd -m builder
        install -d -o builder -m 0700 /home/builder/.ssh
        printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
        echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
          > /home/builder/.ssh/known_hosts
        chown builder /home/builder/.ssh/*
        chmod 0600 /home/builder/.ssh/aur
        cp -r dist/aur /home/builder/aur
        chown -R builder /home/builder/aur
        GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
          runuser -u builder -- /home/builder/aur/publish.sh "$RELEASE_TAG"
