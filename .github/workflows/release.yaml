name: Release

# Prerelease tags (vX.Y.Z-prerelease[.N]) are built by prerelease.yaml, which
# calls this workflow; a tag containing "prerelease" is published as a GitHub
# prerelease and reaches the [pyrowave] repository as pyroshine-prerelease-bin.
on:
  push:
    tags:
      - "v[0-9]*"
      - "!v*prerelease*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.13.0 or v0.18.0-prerelease.1)
        required: true
  workflow_call:
    inputs:
      tag:
        description: Tag to build; defaults to the tag that started the caller
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Every gate runs on the exact commit being released; a release never relies
  # on CI having passed for some other commit. Results and provenance are
  # recorded in release-validation.json and shipped with the release.
  validate:
    name: Validate release commit
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.record.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
    - name: Resolve tag
      id: tag
      env:
        REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        TAG="$REQUESTED_TAG"
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
          echo "Release tag must look like v1.2.3 or v1.2.3-rc.1, got: $TAG" >&2
          exit 1
        fi
        PRERELEASE=false
        if [[ "$TAG" == *prerelease* ]]; then
          # The [pyrowave] repository maps this form to a pacman version.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-prerelease(\.[0-9]+)?$ ]]; then
            echo "Prerelease tags must look like v1.2.3-prerelease or v1.2.3-prerelease.1, got: $TAG" >&2
            exit 1
          fi
          PRERELEASE=true
        fi
        {
          echo "tag=$TAG"
          echo "version=${TAG#v}"
          echo "prerelease=$PRERELEASE"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.tag.outputs.tag }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install dependencies
      uses: ./.github/actions/install-dependencies

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Server checks
      run: |
        set -o pipefail
        mkdir -p "$RUNNER_TEMP/validation"
        python3 -m unittest discover -s scripts -p 'test_changelog.py'
        python3 scripts/changelog.py check --tag "${{ steps.tag.outputs.tag }}"
        cargo fmt --all -- --check
        cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
        RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --workspace --all-features
        cargo test --locked --workspace --all-features 2>&1 | tee "$RUNNER_TEMP/validation/tests.log"

    - name: Pinned PyroWave FFI check (must run, not be skipped)
      run: |
        set -o pipefail
        ./scripts/build-pyrowave.sh "$RUNNER_TEMP/pyrowave" "$RUNNER_TEMP/pyrowave-install"
        MOONSHINE_TEST_PYROWAVE=1 \
        MOONSHINE_PYROWAVE_LIBRARY="$RUNNER_TEMP/pyrowave-install/lib/libpyrowave-shared.so.1" \
          cargo test --locked -p moonshine-core session::stream::video::pyrowave::tests::ffi_loads_pinned_api \
          -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/validation/pyrowave-ffi.log"
        grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/validation/pyrowave-ffi.log"
        grep -q 'pyrowave-ffi: loaded' "$RUNNER_TEMP/validation/pyrowave-ffi.log"

    - name: Known defects and native sanitizer tests
      run: python3 scripts/known_defects.py --json "$RUNNER_TEMP/validation/known-defects.json"

    - name: Web interface checks
      working-directory: web
      run: |
        npm ci
        npm run typecheck
        npm test
        npm run build

    - name: Record validation
      id: record
      run: |
        python3 scripts/record_baseline.py --out "$RUNNER_TEMP/validation/provenance" --metadata-only
        python3 - "$RUNNER_TEMP/validation" <<'PY'
        import json, pathlib, re, sys
        root = pathlib.Path(sys.argv[1])
        provenance = json.loads((root / "provenance" / "manifest.json").read_text())
        tests = re.findall(r"test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored", (root / "tests.log").read_text())
        record = {
            "checkout": provenance["checkout"],
            "toolchain": provenance["toolchain"],
            "runner": provenance["host"],
            "workspace_tests": [dict(zip(("result", "passed", "failed", "ignored"), t)) for t in tests],
            "pyrowave_ffi": "loaded and passed",
            "known_defects": json.loads((root / "known-defects.json").read_text()),
            "hardware_acceptance": "not run by CI; approved through the 'release' environment for this sha",
        }
        (root / "release-validation.json").write_text(json.dumps(record, indent=2) + "\n")
        assert all(t[0] == "ok" and t[2] == "0" for t in tests), "a test suite failed"
        PY
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      with:
        name: release-validation
        path: ${{ runner.temp }}/validation/release-validation.json

  build:
    name: Build and package
    needs: validate
    # Publishing requires approval in the 'release' environment: the reviewer
    # confirms the documented hardware acceptance (docs/reconnect-validation.md,
    # REPORT section 9) was run for exactly this commit.
    environment: release
    # Pin to ubuntu-24.04 (glibc 2.39) so the release binary runs on
    # Ubuntu 24.04+, Fedora 40+, Arch, ...
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.validate.outputs.tag }}

    - name: Build the validated commit only
      env:
        VALIDATED: ${{ needs.validate.outputs.sha }}
      run: test "$(git rev-parse HEAD)" = "$VALIDATED"

    - uses: actions/download-artifact@v4
      with:
        name: release-validation

    - name: Validate changelog and extract release notes
      env:
        RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      run: |
        python3 scripts/changelog.py check --tag "$RELEASE_TAG"
        python3 scripts/changelog.py notes --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      uses: ./.github/actions/install-dependencies

    - name: Build pinned PyroWave
      run: |
        ./scripts/build-pyrowave.sh "$RUNNER_TEMP/pyrowave" "$RUNNER_TEMP/pyrowave-install"
        mkdir -p ./target/release
        cp -L "$RUNNER_TEMP/pyrowave-install/lib/libpyrowave-shared.so.1" \
          ./target/release/libpyrowave-shared.so.1

    - name: Build
      run: cargo build --release --workspace

    # The web interface ships as static files in the server package; Node.js
    # is needed only here. Its build records this version (pyroshine-web.json),
    # which the server checks against its own.
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build web interface
      working-directory: web
      run: |
        npm ci
        npm run build
        test "$(python3 -c 'import json; print(json.load(open("dist/pyroshine-web.json"))["version"])')" = "${{ needs.validate.outputs.version }}"

    - name: Strip and fixup
      run: |
        strip ./target/release/moonshine
        # Remove libunwind — pulled in transitively via libc++ on Ubuntu but
        # never called at runtime (no C++ exceptions in the code path).
        # Can be removed if inputtino-sys is changed to link -lc++ statically
        # or dropped entirely.
        patchelf --remove-needed libunwind.so.1 ./target/release/moonshine

    - name: Bake version into install script
      run: |
        sed -i 's/VERSION="__VERSION__"/VERSION="${{ needs.validate.outputs.tag }}"/' ./dist/pyroshine-install.sh

    # Portable tarball with an FHS-ish layout (bin/, lib/, share/).
    - name: Package portable tarball
      run: |
        STAGE="$RUNNER_TEMP/pyroshine"
        mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/share/pyroshine"
        cp ./target/release/moonshine "$STAGE/bin/pyroshine"
        cp -R ./web/dist "$STAGE/share/pyroshine/web"
        cp ./target/release/libpyrowave-shared.so.1 "$STAGE/lib/"
        cp ./dist/start-pyroshine.sh ./dist/60-pyroshine.rules ./dist/50-pyroshine-inhibit-sleep.rules \
           ./dist/pyroshine-modules.conf ./dist/pyroshine-sysusers.conf \
           ./dist/pyroshine@.service ./dist/pyroshine-desktop-guard.service ./dist/pyroshine.desktop \
           ./dist/pyroshine-atomic-update.conf "$STAGE/share/pyroshine/"
        cp ./dist/pyroshine-install.sh "$STAGE/bin/"
        cp README.md CONTRIBUTING.md LICENSE "$STAGE/"
        cp -R docs "$STAGE/docs"
        tar --zstd -cf "./pyroshine-${{ needs.validate.outputs.tag }}-linux-amd64.tar.zst" \
          -C "$RUNNER_TEMP" pyroshine

    - name: Install nfpm
      env:
        # Pinned release: a `latest/download/` URL breaks once a newer nfpm ships.
        NFPM_VERSION: 2.48.0
        NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
      run: |
        curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
          -o /tmp/nfpm.tar.gz
        echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
        tar xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
        nfpm --version

    - name: Package native formats
      run: |
        export VERSION="${{ needs.validate.outputs.version }}"
        for fmt in deb rpm archlinux; do
          nfpm package --config nfpm.yaml --packager "$fmt" --target .
        done

    - name: Generate checksums
      run: |
        sha256sum \
          ./pyroshine-${{ needs.validate.outputs.tag }}-linux-amd64.tar.zst \
          ./pyroshine_*.deb \
          ./pyroshine-*.rpm \
          ./pyroshine-*.pkg.tar.zst \
          ./dist/pyroshine-install.sh \
          ./release-validation.json \
          > SHA256SUMS

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.validate.outputs.tag }}
        body_path: ${{ runner.temp }}/release-notes.md
        prerelease: ${{ needs.validate.outputs.prerelease }}
        fail_on_unmatched_files: true
        files: |
          ./pyroshine-${{ needs.validate.outputs.tag }}-linux-amd64.tar.zst
          ./pyroshine_*.deb
          ./pyroshine-*.rpm
          ./pyroshine-*.pkg.tar.zst
          ./dist/pyroshine-install.sh
          ./release-validation.json
          ./SHA256SUMS

  # Publishes the release to the [pyrowave] pacman repository by starting the
  # Publish workflow of karsyboy/pyrowave-packages: stable releases as
  # pyroshine-bin, prereleases as pyroshine-prerelease-bin. Other suffixed tags
  # (v1.2.3-rc.1) are not published there. Needs the PACKAGES_DISPATCH_TOKEN
  # secret; see CONTRIBUTING.md.
  pacman:
    name: Update pacman repository
    needs: [validate, build]
    if: ${{ needs.validate.outputs.prerelease == 'true' || !contains(needs.validate.outputs.tag, '-') }}
    runs-on: ubuntu-24.04
    steps:
    - name: Start the pyrowave-packages Publish workflow
      env:
        GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
      run: gh workflow run publish.yml --repo karsyboy/pyrowave-packages
