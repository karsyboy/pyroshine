name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  vendored-sources:
    name: Vendored sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test vendor maintenance tooling
        run: python3 -m unittest discover -s scripts -p 'test_vendor_dependency.py'
      - name: Verify pinned sources and patch series
        run: |
          scripts/vendor-inputtino.sh --check
          scripts/vendor-pixelforge.sh --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Test vendored Pixelforge
        run: scripts/vendor-pixelforge.sh --test

  changelog:
    name: Changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test changelog tooling
        run: python3 -m unittest discover -s scripts -p 'test_changelog.py'
      - name: Check workspace release notes
        run: python3 scripts/changelog.py check

  bench-tooling:
    name: Benchmark and hardware-test tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Result validation/comparison, the baseline workload sets and the
      # hardware-test registry logic; no GPU is needed or used.
      - name: Test benchmark and hardware-test tooling
        run: python3 -m unittest discover -s scripts -p 'test_bench_results.py'

  ci:
    name: ${{ matrix.name }}
    # Pin to ubuntu-24.04 (glibc 2.39) so CI validates the same baseline the
    # release binaries are built against.
    runs-on: ubuntu-24.04

    strategy:
      # Let all legs run to completion even if one fails.
      fail-fast: false
      matrix:
        include:
          - name: Test Suite
            run: cargo test --workspace --all-features
            deps: true
          - name: Clippy
            components: clippy
            run: cargo clippy --workspace --all-features --all-targets -- -D warnings
            deps: true
          - name: Rustfmt
            components: rustfmt
            run: cargo fmt --all -- --check
            deps: false
          - name: Documentation
            run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features
            deps: true
          - name: Cargo Machete
            run: cargo install cargo-machete && cargo machete
            deps: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.components }}

      - name: Install dependencies
        if: matrix.deps
        uses: ./.github/actions/install-dependencies

      - name: Build pinned PyroWave dependency
        if: matrix.name == 'Test Suite'
        run: |
          ./scripts/build-pyrowave.sh "$RUNNER_TEMP/pyrowave" "$RUNNER_TEMP/pyrowave-install"
          test -e "$RUNNER_TEMP/pyrowave-install/lib/libpyrowave-shared.so.1"
          # The check is ignored in ordinary runs; select it explicitly and fail
          # unless it ran and actually loaded the library (no vacuous pass).
          MOONSHINE_TEST_PYROWAVE=1 \
          MOONSHINE_PYROWAVE_LIBRARY="$RUNNER_TEMP/pyrowave-install/lib/libpyrowave-shared.so.1" \
            cargo test -p moonshine-core session::stream::video::pyrowave::tests::ffi_loads_pinned_api \
            -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/pyrowave-ffi.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/pyrowave-ffi.log"
          grep -q 'pyrowave-ffi: loaded' "$RUNNER_TEMP/pyrowave-ffi.log"

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      # Named gates for the session state machine (lifecycle, teardown
      # ownership, authorization generations) and wire/protocol contracts.
      # They also run above; a failure here names the regressed contract.
      - name: Session lifecycle and protocol regression gates
        if: matrix.name == 'Test Suite'
        run: |
          cargo test -p moonshine-core --lib --all-features -- \
            session::manager:: session::lifecycle:: session::authorization:: session::status:: \
            rtsp:: session::stream::control:: session::stream::video::packetizer:: \
            session::stream::video::pyrowave_protocol:: session::stream::video::tests::

      # Every ignored (hardware) test must be registered with its requirements.
      # The availability report lists them as skipped here: hosted runners have
      # no GPU, so these tests are never reported as passed or failed.
      - name: Hardware test registry and availability
        if: matrix.name == 'Test Suite'
        run: |
          python3 scripts/hardware_tests.py check-registry
          python3 scripts/hardware_tests.py report --json "$RUNNER_TEMP/hardware-tests.json" | tee "$RUNNER_TEMP/hardware-tests.txt"
          {
            echo '### Hardware tests (not run on hosted runners)'
            echo '```'
            cat "$RUNNER_TEMP/hardware-tests.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Characterizations of open review findings must keep failing for their
      # recorded reason (scripts/known_defects.toml), and the hardware-independent
      # native controller tests run under AddressSanitizer/UBSan. GPU entries
      # are reported as not run here.
      - name: Known defects and native sanitizer tests
        if: matrix.name == 'Test Suite'
        run: python3 scripts/known_defects.py --json "$RUNNER_TEMP/known-defects.json"

  # The web interface's frontend (Node.js is needed to build it, never at
  # runtime). The tray is part of the server binary, checked with it.
  web:
    name: Web interface
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          test -f dist/index.html && test -f dist/pyroshine-web.json
