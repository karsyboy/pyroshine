name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test changelog tooling
        run: python3 -m unittest discover -s scripts -p 'test_changelog.py'
      - name: Check workspace release notes
        run: python3 scripts/changelog.py check

  ci:
    name: ${{ matrix.name }}
    # Pin to ubuntu-24.04 (glibc 2.39) so CI validates the same baseline the
    # release binaries are built against.
    runs-on: ubuntu-24.04

    strategy:
      # Let all legs run to completion even if one fails.
      fail-fast: false
      matrix:
        include:
          - name: Test Suite
            run: cargo test --workspace --all-features
            deps: true
          - name: Clippy
            components: clippy
            run: cargo clippy --workspace --all-features --all-targets -- -D warnings
            deps: true
          - name: Rustfmt
            components: rustfmt
            run: cargo fmt --all -- --check
            deps: false
          - name: Documentation
            run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features
            deps: true
          - name: Cargo Machete
            run: cargo install cargo-machete && cargo machete
            deps: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.components }}

      - name: Install dependencies
        if: matrix.deps
        uses: ./.github/actions/install-dependencies

      - name: Build pinned PyroWave dependency
        if: matrix.name == 'Test Suite'
        run: |
          ./scripts/build-pyrowave.sh "$RUNNER_TEMP/pyrowave" "$RUNNER_TEMP/pyrowave-install"
          test -e "$RUNNER_TEMP/pyrowave-install/lib/libpyrowave-shared.so.1"
          # The check is ignored in ordinary runs; select it explicitly and fail
          # unless it ran and actually loaded the library (no vacuous pass).
          MOONSHINE_TEST_PYROWAVE=1 \
          MOONSHINE_PYROWAVE_LIBRARY="$RUNNER_TEMP/pyrowave-install/lib/libpyrowave-shared.so.1" \
            cargo test -p moonshine-core session::stream::video::pyrowave::tests::ffi_loads_pinned_api \
            -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/pyrowave-ffi.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/pyrowave-ffi.log"
          grep -q 'pyrowave-ffi: loaded' "$RUNNER_TEMP/pyrowave-ffi.log"

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      # Characterizations of open review findings must keep failing for their
      # recorded reason (scripts/known_defects.toml), and the hardware-independent
      # native controller tests run under AddressSanitizer/UBSan. GPU entries
      # are reported as not run here.
      - name: Known defects and native sanitizer tests
        if: matrix.name == 'Test Suite'
        run: python3 scripts/known_defects.py --json "$RUNNER_TEMP/known-defects.json"

  desktop:
    name: Desktop app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pyroshine-ui
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pyroshine-ui/package-lock.json

      - name: Frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
