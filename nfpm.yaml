# nfpm configuration — emits .deb, .rpm, and Arch packages from the prebuilt
# binaries. Used by .github/workflows/release.yaml.
#
# VERSION is injected by the release workflow (GITHUB_REF_NAME minus the 'v').

name: pyroshine
arch: amd64 # nfpm maps this to the native architecture for each packager.
platform: linux
version: ${VERSION}
release: "1"
maintainer: "Pyroshine contributors"
description: |
  Pyroshine streaming server for Moonlight clients.
  Includes native PyroWave support, its web management interface and a
  desktop tray that the server shows while you are signed in to a desktop.
homepage: "https://github.com/karsyboy/pyroshine"
license: "BSD-2-Clause"
# The tray and launcher were the separate pyroshine-ui package before 0.18.
replaces:
  - moonshine
  - moonshine-bin
  - pyroshine-ui
conflicts:
  - moonshine
  - moonshine-bin
  - pyroshine-ui
provides:
  - pyroshine-ui

contents:
  - src: ./target/release/moonshine
    dst: /usr/bin/pyroshine
  - src: ./dist/start-pyroshine.sh
    dst: /usr/bin/start-pyroshine.sh
  - src: ./target/release/libpyrowave-shared.so.1
    dst: /usr/lib/libpyrowave-shared.so.1
  - src: ./dist/60-pyroshine.rules
    dst: /usr/lib/udev/rules.d/60-pyroshine.rules
  - src: ./dist/pyroshine-modules.conf
    dst: /usr/lib/modules-load.d/pyroshine.conf
  - src: ./dist/pyroshine@.service
    dst: /usr/lib/systemd/system/pyroshine@.service
  - src: ./dist/50-pyroshine-inhibit-sleep.rules
    dst: /usr/share/polkit-1/rules.d/50-pyroshine-inhibit-sleep.rules
  - src: ./dist/pyroshine-sysusers.conf
    dst: /usr/lib/sysusers.d/pyroshine.conf
  # The web management interface's files, built from web/ (the release
  # builds them first; Node.js is not needed at runtime).
  - src: ./web/dist
    dst: /usr/share/pyroshine/web
    type: tree
  # Application-menu entry opening the web interface; the tray itself is
  # started by the server (no autostart entry).
  - src: ./dist/pyroshine.desktop
    dst: /usr/share/applications/pyroshine.desktop
  - src: ./dist/icons/hicolor/16x16/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/16x16/apps/pyroshine.png
  - src: ./dist/icons/hicolor/22x22/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/22x22/apps/pyroshine.png
  - src: ./dist/icons/hicolor/24x24/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/24x24/apps/pyroshine.png
  - src: ./dist/icons/hicolor/32x32/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/32x32/apps/pyroshine.png
  - src: ./dist/icons/hicolor/48x48/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/48x48/apps/pyroshine.png
  - src: ./dist/icons/hicolor/64x64/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/64x64/apps/pyroshine.png
  - src: ./dist/icons/hicolor/128x128/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/128x128/apps/pyroshine.png
  - src: ./dist/icons/hicolor/256x256/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/256x256/apps/pyroshine.png
  - src: ./dist/icons/hicolor/512x512/apps/pyroshine.png
    dst: /usr/share/icons/hicolor/512x512/apps/pyroshine.png
  # License locations differ per distro.
  - src: ./LICENSE
    dst: /usr/share/licenses/pyroshine/LICENSE
    packager: rpm
  - src: ./LICENSE
    dst: /usr/share/doc/pyroshine/copyright
    packager: deb
  - src: ./LICENSE
    dst: /usr/share/licenses/pyroshine/LICENSE
    packager: archlinux

scripts:
  postinstall: ./dist/nfpm/pyroshine-postinstall.sh
  postremove: ./dist/nfpm/pyroshine-postremove.sh

# Dependency names differ per distro.
overrides:
  deb:
    depends:
      - libc6
      - libopus0
      - libevdev2
      - libxkbcommon0
      - libgbm1
      - libstdc++6
      - libgcc-s1
      - libvulkan1
      - libwayland-client0
      - xwayland
    # The tray opens the browser through the desktop portal or xdg-open;
    # libva is loaded at runtime for VA-API encoding (Intel GPUs).
    recommends:
      - xdg-desktop-portal
      - xdg-utils
      - libva2
      - libva-drm2
  rpm:
    depends:
      - glibc
      - opus
      - libevdev
      - libxkbcommon
      - mesa-libgbm
      - libstdc++
      - libgcc
      - libwayland-client
      - vulkan-loader
      - xorg-x11-server-Xwayland
    recommends:
      - xdg-desktop-portal
      - xdg-utils
      - libva
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - hicolor-icon-theme
      - libdrm
      - libevdev
      - libffi
      - libxkbcommon
      - mesa
      - opus
      - vulkan-icd-loader
      - wayland
      - xorg-xwayland
